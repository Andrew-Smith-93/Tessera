name: Publish Release & KDE Store Assets

on:
  push:
    tags:
      - 'v*'

permissions: {}

jobs:
  build-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node.js
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: 22
          cache: 'npm'

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - name: Install Node Dependencies
        run: npm ci

      - name: Audit Production Dependencies
        run: npm audit --omit=dev

      - name: Run TypeScript Unit Tests
        run: npm test

      - name: Run TypeScript Typecheck
        run: npm run typecheck

      - name: Build Monorepo & Fresh JavaScript Bridges
        run: npm run build

      - name: Verify Generated Artifacts Up-To-Date
        run: npm run verify:artifacts

      - name: Verify Protocol V1 Freeze Manifest
        run: npm run verify:freeze

      - name: Verify Runtime Simulator Goldens & Fixed Stress Seeds
        run: |
          npm run sim:verify
          npm run sim:run -- --seed 42 --quiet
          npm run sim:run -- --seed 12345 --quiet
          npm run sim:run -- --seed 99999 --quiet

      - name: Validate Python Syntax & Bytecode Compilation
        run: |
          python3 -m py_compile tests/*.py
          echo "All Python modules compiled successfully."

      - name: Validate JSON Manifests
        run: |
          python3 -c "import json; json.load(open('metadata.json'))"
          echo "metadata.json is valid."

      - name: Validate XML Config Schema
        run: |
          python3 -c "import xml.etree.ElementTree as ET; ET.parse('contents/config/main.xml')"
          echo "contents/config/main.xml is valid XML."

      - name: Run Python Unit Tests
        run: |
          python3 -m unittest discover -s tests -p "test_*.py" -v

      - name: Build Official .kwinscript Bundle
        run: |
          chmod +x package.sh
          ./package.sh

      - name: Validate Package Archive Integrity
        run: |
          unzip -t dist/*.kwinscript
          unzip -l dist/*.kwinscript | grep "contents/code/layouts.js"
          unzip -l dist/*.kwinscript | grep "contents/code/rules.js"
          unzip -l dist/*.kwinscript | grep "contents/code/reconciler.js"
          echo "Package archive structure verified successfully."

      - name: Generate Checksums
        run: |
          (cd dist && sha256sum *.kwinscript > SHA256SUMS.txt)
          cat dist/SHA256SUMS.txt

      - name: Create Draft GitHub Release
        uses: softprops/action-gh-release@c95fe1489396fe8a9eb87c0abf8aa5b2ef267fda # v2.2.1
        with:
          files: |
            dist/*.kwinscript
            dist/SHA256SUMS.txt
          generate_release_notes: true
          draft: true
          fail_on_unmatched_files: true
          prerelease: false
