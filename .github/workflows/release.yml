name: Publish Release & KDE Store Assets

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Node Dependencies
        run: npm ci

      - name: Run TypeScript Unit Tests
        run: npm test

      - name: Run TypeScript Typecheck
        run: npm run typecheck

      - name: Build Monorepo & Fresh JavaScript Layouts Bridge
        run: npm run build

      - name: Verify Generated Artifacts Up-To-Date
        run: npm run verify:artifacts

      - name: Build Official .kwinscript Bundle
        run: |
          chmod +x package.sh
          ./package.sh

      - name: Validate Package Archive Integrity
        run: |
          unzip -t dist/*.kwinscript
          unzip -l dist/*.kwinscript | grep "contents/code/layouts.js"

      - name: Package Standalone Control Center
        run: |
          TAG_NAME=${GITHUB_REF#refs/tags/}
          tar -czf "dist/tessera-control-center-${TAG_NAME}.tar.gz" tessera-control/ desktop/ bin/ README.md LICENSE

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.kwinscript
            dist/*.tar.gz
          generate_release_notes: true
          draft: false
          prerelease: false
