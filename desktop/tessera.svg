<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e2638"/>
      <stop offset="100%" stop-color="#0f141d"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3daee9"/>
      <stop offset="100%" stop-color="#1d78b5"/>
    </linearGradient>
    <linearGradient id="tileGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2c3a4f"/>
      <stop offset="100%" stop-color="#1f2837"/>
    </linearGradient>
  </defs>

  <!-- Base Rounded Container -->
  <rect x="8" y="8" width="112" height="112" rx="24" fill="url(#bgGrad)" stroke="#3daee9" stroke-width="3" stroke-opacity="0.6"/>

  <!-- Master Window Pane (Left, Accentuated) -->
  <rect x="20" y="20" width="46" height="88" rx="8" fill="url(#accentGrad)" opacity="0.95"/>
  <rect x="25" y="26" width="36" height="6" rx="3" fill="#ffffff" opacity="0.8"/>

  <!-- Stack Window Pane 1 (Top Right) -->
  <rect x="72" y="20" width="36" height="41" rx="8" fill="url(#tileGrad1)" stroke="#4a5a73" stroke-width="2"/>
  <rect x="77" y="26" width="26" height="5" rx="2.5" fill="#3daee9" opacity="0.7"/>

  <!-- Stack Window Pane 2 (Bottom Right) -->
  <rect x="72" y="67" width="36" height="41" rx="8" fill="url(#tileGrad1)" stroke="#4a5a73" stroke-width="2"/>
  <rect x="77" y="73" width="26" height="5" rx="2.5" fill="#3daee9" opacity="0.7"/>
</svg>
