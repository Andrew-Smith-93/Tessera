[package]
name = "tessera-daemon"
version = "0.1.0"
edition = "2021"
authors = ["Andrew Smith <137859776+Andrew-Smith-93@users.noreply.github.com>"]
description = "Optional companion daemon for Tessera KWin tiling window manager"
license = "MIT"

[dependencies]
tokio = { version = "1.43", features = ["rt-multi-thread", "macros", "io-util", "net", "time", "sync", "signal"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
jsonschema = { version = "0.56", default-features = false }
thiserror = "2.0"
libc = "0.2"

[dev-dependencies]
tempfile = "3.17"
